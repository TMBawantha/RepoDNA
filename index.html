<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>RepoDNA</title>
  </head>
  <body>
    <main class="mx-auto max-w-2xl px-6 py-16">
      <p class="font-semibold text-slate-900">RepoDNA</p>
      <h1 class="mt-8 text-3xl font-semibold text-slate-900">Explore your repository</h1>
      <form id="repository-form" class="mt-3" novalidate>
        <p id="repository-hint" class="text-slate-700">
          Enter a public GitHub repository URL to get started.
        </p>
        <label for="repository-url" class="sr-only">GitHub repository URL</label>
        <input
          id="repository-url"
          name="repository-url"
          type="url"
          required
          autocapitalize="none"
          spellcheck="false"
          aria-describedby="repository-hint repository-error"
          placeholder="https://github.com/owner/repo"
          class="mt-4 w-full rounded-lg border border-slate-500 px-4 py-3 text-slate-900 placeholder:text-slate-600 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700 aria-invalid:border-red-700"
        />
        <p id="repository-error" role="alert" class="text-sm text-red-700 not-empty:mt-2"></p>
        <button
          type="submit"
          class="mt-4 rounded-lg bg-indigo-700 px-4 py-3 font-semibold text-white hover:bg-indigo-800 focus-visible:outline-2 focus-visible:outline-offset-2 focus-visible:outline-indigo-700"
        >
          View Repository Details
        </button>
        <p id="repository-status" role="status" class="text-sm text-slate-700 not-empty:mt-4"></p>
      </form>
      <section
        id="repository-details"
        aria-labelledby="repository-title"
        class="mt-8 rounded-xl border border-slate-200 p-6"
        hidden
      >
        <h2 id="repository-title" class="text-xl font-semibold text-slate-900"></h2>
        <p id="repository-description" class="mt-2 text-slate-700"></p>
        <dl class="mt-5 grid grid-cols-2 gap-4 text-sm sm:grid-cols-3">
          <div>
            <dt class="text-slate-600">Primary language</dt>
            <dd data-metadata="language" class="mt-1 font-medium"></dd>
          </div>
          <div>
            <dt class="text-slate-600">License</dt>
            <dd data-metadata="license" class="mt-1 font-medium"></dd>
          </div>
          <div>
            <dt class="text-slate-600">Default branch</dt>
            <dd data-metadata="defaultBranch" class="mt-1 font-medium"></dd>
          </div>
          <div>
            <dt class="text-slate-600">Visibility</dt>
            <dd data-metadata="visibility" class="mt-1 font-medium capitalize"></dd>
          </div>
          <div>
            <dt class="text-slate-600">Stars</dt>
            <dd data-metadata="stars" class="mt-1 font-medium"></dd>
          </div>
          <div>
            <dt class="text-slate-600">Forks</dt>
            <dd data-metadata="forks" class="mt-1 font-medium"></dd>
          </div>
        </dl>
      </section>
      <section
        id="repository-file-tree"
        aria-labelledby="repository-tree-title"
        class="mt-6 rounded-xl border border-slate-200 p-6"
        hidden
      >
        <h2 id="repository-tree-title" class="text-xl font-semibold text-slate-900">File tree</h2>
        <p id="repository-tree-warning" class="mt-2 text-sm text-amber-800" hidden>
          GitHub returned a partial tree. The totals only cover the files and directories shown
          here.
        </p>
        <p id="repository-tree-counts" class="mt-2 text-sm text-slate-700"></p>
        <div id="repository-tree-content" class="mt-4 overflow-x-auto text-sm break-all"></div>
      </section>
    </main>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
